

<script>

const AUTOCADENCE_FILTER = "autocadence -c -d | shed -ke 's/:cvf:([^:]*):t=[^:]*/:cvf:$1/gL' | shed -ke 's/:diss:([^:]*):t=[^:]*/:diss:$1/gL'";

const WORK_TEXT_BASE_URL = "https://raw.githubusercontent.com/benory/1520s-project-scores/main/";
const WORK_TEXT_INDEX = {% include metadata/texts.json %};

async function displayWorkText(id, container) {
	try {
		const path = Object.hasOwn(WORK_TEXT_INDEX, id) ? WORK_TEXT_INDEX[id] : null;
		if (!path) return;
		if (typeof path !== "string" || !path.startsWith("texts/") ||
			!path.endsWith(".txt") || path.split("/").includes("..")) {
			throw new Error(`Invalid text path for ${id}`);
		}
		const response = await fetch(WORK_TEXT_BASE_URL + path.split("/").map(encodeURIComponent).join("/"));
		if (!response.ok) throw new Error(`Work text: HTTP ${response.status}`);
		const text = (await response.text()).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n").replace(/\n+$/, "");
		if (!text.trim() || !container.isConnected) return;
		const lines = text.split("\n");
		const label = document.createElement("b");
		label.textContent = "Text:";
		const content = document.createElement("span");
		content.className = "work-text-content";
		content.id = "work-text-content";
		const renderLines = visibleLines => {
			content.replaceChildren(...visibleLines.map(line => {
				const verse = document.createElement("span");
				verse.className = "work-text-line";
				verse.textContent = line;
				return verse;
			}));
		};
		renderLines(lines.slice(0, 3));
		container.replaceChildren(label, document.createTextNode(" "), content);
		if (lines.length > 3) {
			const button = document.createElement("button");
			button.type = "button";
			button.className = "commentary-toggle";
			button.textContent = "See more";
			button.setAttribute("aria-expanded", "false");
			button.setAttribute("aria-controls", content.id);
			button.addEventListener("click", () => {
				const expanded = button.getAttribute("aria-expanded") !== "true";
				renderLines(expanded ? lines : lines.slice(0, 3));
				button.setAttribute("aria-expanded", String(expanded));
				button.textContent = expanded ? "See less" : "See more";
			});
			container.appendChild(button);
		}
		container.hidden = false;
	} catch (error) {
		console.warn(`Unable to load text for ${id}:`, error);
	}
}

//////////////////////////////
//
// createLookup -- Convert an array of objects into a lookup table, where the
//    "ID" property of the objects is used as the key value for the lookup table.
//    For example if the ID of an entry is "Jac2001" in the input array, then
//    output.Jac2001 (or output["Jac2001"]) will return the entry for work ID "Jac2001".
//

function createLookup(dataArray) {
	if (!Array.isArray(dataArray)) {
		console.error("ERROR: input is not an array:", dataArray);
		return;
	}
	let output = {};
	for (entry of dataArray) {
		let id = entry.ID
		output[id] = entry;
	}
	return output;
}


//////////////////////////////
//
// Commentary formatting -- Keep each source occurrence, including multiple
//     entries from the same manuscript. The shared Commentary ID is explicit
//     in Works; it must not be inferred from movement or version suffixes.
//

function escapeCommentaryText(value) {
	return String(value || "").trim().replace(/[&<>"']/g, character => ({
		"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
	}[character]));
}

function formatCommentarySource(source, diamm, rism) {
	let name = String(source || "").trim();
	// Printed sources use the editors' convention: Printer, Title (date).
	let print = name.match(/^([^,]+),\s*(.+?)(\s+\([^()]*\))$/);
	let label = print
		? `${escapeCommentaryText(print[1])}, <i>${escapeCommentaryText(print[2])}</i> ${escapeCommentaryText(print[3])}`
		: escapeCommentaryText(name);
	let links = [diamm, rism].map(value => String(value || "").trim());
	let link = links.find(value => /^https?:\/\//i.test(value));
	if (!link) {
		return label;
	}
	let output = `<a target="_blank" rel="noopener noreferrer" href="${escapeCommentaryText(link)}">${label}</a>`;
	if (link === links[0] && /^https?:\/\//i.test(links[1]) && links[1] !== link) {
		output += ` (<a target="_blank" rel="noopener noreferrer" href="${escapeCommentaryText(links[1])}">RISM</a>)`;
	}
	return output;
}

function formatCommentaryMovements(value, workinfo) {
	let movements = String(value || "").trim();
	if (!movements || /^all$/i.test(movements)) {
		return "";
	}
	let names = {K: "Kyrie", G: "Gloria", C: "Credo", S: "Sanctus", A: "Agnus"};
	if (workinfo.Genre === "mass" && /requiem/i.test(workinfo.Title || "")) {
		names = {I: "Introit", K: "Kyrie", G: "Gradual", R: "Responsorium", V: "Versus", O: "Offertory", S: "Sanctus", A: "Agnus", C: "Communion"};
	}
	let codes = Array.from(movements);
	if (!codes.every(code => names[code])) {
		// Preserve edited prose or unrecognized abbreviations as entered.
		return movements;
	}
	let labels = codes.map(code => names[code]);
	let last = labels.pop();
	return `${labels.length ? labels.join(", ") + " and " : ""}${last}, only`;
}

function formatCommentaryDetails(entry, workinfo, includeMovements = true) {
	let details = [];
	let attribution = String(entry.Attribution || "").trim();
	if (attribution && !/^anonymous$/i.test(attribution)) {
		details.push(`attribution: ${attribution}`);
	}
	if (includeMovements) {
		let movements = formatCommentaryMovements(entry.Movements, workinfo);
		if (movements) details.push(movements);
	}
	return details.length ? ` (${escapeCommentaryText(details.join("; "))})` : "";
}

function formatCommentaryNotes(entry) {
	let notes = escapeCommentaryText(entry.Notes);
	return notes ? `<span class="commentary-notes">${notes}</span>` : "";
}

function compareCommentarySources(a, b) {
	let [left, right] = [a, b].map(entry => {
		let name = String(entry.Source || "").trim();
		// Printed sources follow Printer, Title (date); use the date, not the title.
		let print = name.match(/^([^,]+),\s*(.+?)\s+\(([^()]*)\)$/);
		let year = print && print[3].match(/\b\d{4}\b/);
		return {name, group: print ? print[1].trim() : name, year: year ? Number(year[0]) : Infinity};
	});
	let options = {sensitivity: "base", numeric: true, ignorePunctuation: true};
	return left.group.localeCompare(right.group, "en", options)
		|| left.year - right.year
		|| left.name.localeCompare(right.name, "en", options);
}

// Preserve empty positions: a missing first link must not become the second link.
function getFirstSources(workinfo) {
	let names = String(workinfo["First Source"] || "").split(";").map(value => value.trim());
	let sources = names.map(name => ({"First Source": name}));
	let fields = ["DIAMM Source Link", "RISM Source Link", "IIIF Source", "IIIF Manifest",
		"RISM or CC Source Sigla", "Pages, Folios, or Numbers", "Mensuration Signs in Earliest Source"];
	for (let field of fields) {
		let raw = workinfo[field];
		if (Array.isArray(raw)) raw = raw.join(";");
		let values = sources.length === 1 ? [String(raw || "").trim()] : String(raw || "").split(field === "Mensuration Signs in Earliest Source" ? "/" : ";").map(value => value.trim());
		if (raw && values.length !== sources.length) {
			console.warn(`Source field count mismatch for ${workinfo.ID}: ${field}`);
			// An incomplete list is ambiguous; never assign it to an arbitrary source.
			continue;
		}
		sources.forEach((source, index) => source[field] = values[index] || "");
	}
	return sources;
}

function getWorkCommentary(workinfo) {
	let commentaryId = String(workinfo["Commentary ID"] || "").trim();
	let entries = commentaryId ? (DATA1520.metadata.commentary || []).filter(entry =>
		String(entry["Commentary ID"] || "").trim() === commentaryId &&
		String(entry.Source || "").trim()
	) : [];
	let sources = getFirstSources(workinfo);
	let earliest = new Array(sources.length).fill(null);
	let candidates = sources.map(() => []);
	for (let entry of entries) {
		let marker = String(entry["Earliest Source"] || "").trim();
		let match = marker.match(/^yes([1-9]\d*)?$/i);
		if (!match) {
			if (/^yes/i.test(marker)) console.warn("Invalid earliest source marker", workinfo.ID, marker);
			continue;
		}
		let index = match[1] ? Number(match[1]) - 1 : (sources.length === 1 ? 0 : -1);
		if (index < 0 || index >= sources.length || !sources[index]["First Source"]) {
			console.warn("Unmatched earliest source marker", workinfo.ID, marker);
			continue;
		}
		candidates[index].push(entry);
	}
	candidates.forEach((matches, index) => {
		if (matches.length === 1) earliest[index] = matches[0];
		else if (matches.length > 1 || (entries.length && sources.length > 1)) {
			console.warn("Missing or duplicate earliest source match", workinfo.ID, index + 1);
		}
	});
	let others = entries.filter(entry => !earliest.includes(entry)).sort(compareCommentarySources);
	let output = "";
	if (others.length) {
		let sources = others.map((entry, index) => {
			let source = formatCommentarySource(entry.Source, entry["DIAMM link"], entry["RISM link"]);
			let folios = escapeCommentaryText(entry["Fols./pp./no."]);
			return `<li class="commentary-source"${index >= 3 ? " hidden" : ""}>${source}${folios ? ", " + folios : ""}${formatCommentaryDetails(entry, workinfo)}${formatCommentaryNotes(entry)}</li>`;
		}).join("");
		let toggle = others.length > 3
			? `<button type="button" class="commentary-toggle" aria-expanded="false" aria-controls="commentary-source-list" onclick="toggleCommentarySources(this)">See more</button>`
			: "";
		let heading = String(workinfo.Subtitle || "").trim()
			? `Other sources for <i>${escapeCommentaryText(workinfo.Title)}</i>:`
			: "Other sources:";
		output = `<div class="commentary-sources"><b>${heading}</b><ul id="commentary-source-list" class="commentary-source-list" role="list">${sources}</ul>${toggle}</div>`;
	}
	return {earliest, output};
}

function toggleCommentarySources(button) {
	let expanded = button.getAttribute("aria-expanded") !== "true";
	let sources = button.closest(".commentary-sources").querySelectorAll(".commentary-source");
	sources.forEach((source, index) => {
		if (index >= 3) source.hidden = !expanded;
	});
	button.setAttribute("aria-expanded", String(expanded));
	button.textContent = expanded ? "See fewer sources" : "See more";
}



//////////////////////////////
//
// formatCreditNames -- Convert semicolon-separated names to a natural-language
//     list while leaving already formatted credits unchanged.
//

function formatCreditNames(value) {
	let names = String(value || "")
		.split(";")
		.map(function(name) { return name.trim(); })
		.filter(Boolean);

	if (names.length < 2) {
		return names[0] || "";
	}
	if (names.length === 2) {
		return `${names[0]} and ${names[1]}`;
	}
	return `${names.slice(0, -1).join(", ")}, and ${names[names.length - 1]}`;
}



//////////////////////////////
//
// appendCreditLink -- Append an external credit link.
//

function appendCreditLink(element, text, url) {
	let link = document.createElement("a");
	link.href = url;
	link.target = "_blank";
	link.rel = "noopener noreferrer";
	link.textContent = text;
	element.appendChild(link);
}



//////////////////////////////
//
// displayScoreCredit -- Display editor and transcriber credits immediately
//     above the score.
//

function displayScoreCredit(id) {
	let element = document.querySelector("#score-credit");
	if (!element) {
		console.error("ERROR: no #score-credit element");
		return;
	}

	element.replaceChildren();

	if (!id) {
		id = DATA1520.workid;
	}
	let workinfo = DATA1520.lookup.works[id];
	if (!workinfo) {
		console.error(`Error: Cannot find workinfo for ${id} in displayScoreCredit()`);
		return;
	}

	let editor = formatCreditNames(workinfo.Editor) || "The 1520s Project";
	let transcriber = formatCreditNames(workinfo.Transcriber);
	let commentaryUrl = String(workinfo["Critical Commentary"] || "").trim();
	let otherUrl = String(workinfo["Other URL"] || "").trim();

	if (editor) {
		let editorLine = document.createElement("div");
		editorLine.className = "work-score-credit-line";
		let editorLabel = document.createElement("span");
		editorLabel.className = "work-score-credit-label";
		editorLabel.textContent = "Edited ";
		editorLine.appendChild(editorLabel);

		let editorValue = document.createElement("span");
		editorValue.className = "work-score-credit-value";
		editorValue.appendChild(document.createTextNode("by "));

		if (otherUrl) {
			let leadingArticle = "the ";
			if (editor.startsWith(leadingArticle)) {
				editorValue.appendChild(document.createTextNode(leadingArticle));
				appendCreditLink(editorValue, editor.slice(leadingArticle.length), otherUrl);
			} else {
				appendCreditLink(editorValue, editor, otherUrl);
			}
		} else {
			editorValue.appendChild(document.createTextNode(editor));
		}

		if (commentaryUrl) {
			editorValue.appendChild(document.createTextNode(" ("));
			appendCreditLink(editorValue, "critical commentary", commentaryUrl);
			editorValue.appendChild(document.createTextNode(")"));
		}

		editorLine.appendChild(editorValue);
		element.appendChild(editorLine);
	}

	if (transcriber) {
		let transcriberLine = document.createElement("div");
		transcriberLine.className = "work-score-credit-line";
		let transcriberLabel = document.createElement("span");
		transcriberLabel.className = "work-score-credit-label";
		transcriberLabel.textContent = "Transcribed ";
		transcriberLine.appendChild(transcriberLabel);

		let transcriberValue = document.createElement("span");
		transcriberValue.className = "work-score-credit-value";
		transcriberValue.textContent = `by ${transcriber}`;
		transcriberLine.appendChild(transcriberValue);
		element.appendChild(transcriberLine);
	}
}



//////////////////////////////
//
// displayWorkInfo -- Show information table at top of page.
//

function displayWorkInfo(id) {
	let element = document.querySelector("#work-info");
	if (!element) {
		console.error("ERROR: no #work-info element");
		return;
	}

	if (!id) {
		id = DATA1520.workid;
	}
	if (!id) {
		id = "Jac2001";
	}
	DATA1520.workid = id;

	let workinfo = DATA1520.lookup.works[id];
	if (!workinfo) {
		console.error(`Error: Cannot find workinfo for ${id} in displayWorkInfo()`);
	}

	let comid = "";
	let matches = id.match(/^([A-Z][a-z][a-z])/);
	if (matches) {
		comid = matches[1];
	}
	let cominfo = {};
	if (comid) {
		cominfo = DATA1520.lookup.composers[comid];
	}
	if (!comid) {
		console.error(`Error: Problem finding ${comid} in composer info`);
	}

	let output = "";

	let title       = workinfo.Title;
	let subtitle    = workinfo.Subtitle;
	let titleoutput = "";
	if (title) {
		if (subtitle){
			titleoutput = `<div class="work-item"><b>Title:</b> ${title}, ${subtitle}</div>`;
		}
		else {
			titleoutput = `<div class="work-item"><b>Title:</b> ${title}</div>`;
		}
	}

	let composer = workinfo.Composer;
	let composeroutput = "";
	if (composer) {
		let matches = composer.match(/^(.*?)\s*,\s*(.*?)$/);
		if (matches) {
			composer = `${matches[2]} ${matches[1]}`;
		}

		composeroutput = `<div class="work-item"><b>Composer:</b> ${composer}`;

		let diammcomp = cominfo["Composer DIAMM page"];
		let rismPersonId = cominfo["Composer RISM ID"];

		if (rismPersonId) {
			if (rismPersonId.match(/^[a-z]{2}/)) {
				// Remove "pe" prefix on rism person number:
				rismPersonId = rismPersonId.substring(2);
			}
		}
		if (diammcomp) {
			composeroutput += ` <span class="info-link">(<a target="_blank" href="${diammcomp}">DIAMM</a>)</span>`;
		}
		if (rismPersonId) {
			composeroutput += ` <span class="info-link">(<a target="_blank" href="https://rism.online/people/${rismPersonId}">RISM</a>)</span>`;
		}
		composeroutput += `</div>`;
	}

	// Add line in work info for implausible attributions with anonymous works
	let attrimplausible = workinfo["Implausible Attribution"];
	let attrimprobable  = workinfo["Improbable Attribution"];
	let attrplausible   = workinfo["Plausible Attribution"];

	let attrimplausiblename = "";
	let attrimprobablename  = "";
	let attrplausiblename   = "";

	let attrimplausibleoutput = "";
	let attrimprobableoutput  = "";
	let attrplausibleoutput   = "";

	// Adjust category names for singular/plural:

	if (attrimplausible) {
		if (attrimplausible.includes(";")) {
			attrimplausiblename = "Implausible attributions";
		} else {
			attrimplausiblename = "Implausible attribution";
		}
	}

	if (attrimprobable) {
		if (attrimprobable.includes(";")) {
			attrimprobablename = "Improbable attributions";
		} else {
			attrimprobablename = "Improbable attribution";
		}
	}

	if (attrplausible) {
		if (attrplausible.includes(";")) {
			attrplausiblename = "Plausible attributions";
		} else {
			attrplausiblename = "Plausible attribution";
		}
	}

	// Add work items for unlikely/false attributions:

	if (attrplausible) {
		attrplausibleoutput = `<div class="work-item"><b>${attrplausiblename}:</b> ${attrplausible}</div>`;
	}

	if (attrimprobable) {
		attrimprobableoutput = `<div class="work-item"><b>${attrimprobablename}:</b> ${attrimprobable}</div>`;

	}

	if (attrimplausible) {
		attrimplausibleoutput = `<div class="work-item"><b>${attrimplausiblename}:</b> ${attrimplausible} </div>`;

	}

	// Add work item for genre:

	let genre = workinfo.Genre;
	let genreoutput = "";
	if (genre) {
		genreoutput += `<div class="work-item"><b>Genre:</b> ${genre}</div>`;
	}

	let uniquesource = workinfo["Unique Source"];
	let sourceoutput = "";
	let commentary = getWorkCommentary(workinfo);
	let firstSources = getFirstSources(workinfo);
	firstSources.forEach((sourceInfo, index) => {
		let earliest = commentary.earliest[index];
		let source = earliest ? earliest.Source : sourceInfo["First Source"];
		if (!source) return;
		let diamm = (earliest && earliest["DIAMM link"]) || sourceInfo["DIAMM Source Link"];
		let rism = (earliest && earliest["RISM link"]) || sourceInfo["RISM Source Link"];
		let folios = sourceInfo["Pages, Folios, or Numbers"];
		let type = firstSources.length > 1 ? "Earliest" : uniquesource === "yes" ? "Unique" : earliest ? "Earliest" : "First";
		let number = firstSources.length > 1 ? ` ${index + 1}` : "";
		sourceoutput += `<div class="work-item source-item"><b>${type} source${number}:</b><span class="source-value">${formatCommentarySource(source, diamm, rism)}`;
		if (folios) sourceoutput += `, ${escapeCommentaryText(folios)}`;
		if (earliest) sourceoutput += formatCommentaryDetails(earliest, workinfo, false) + formatCommentaryNotes(earliest);
		sourceoutput += `</span></div>`;
	});

	let date = workinfo["First Source Date"];
	let dateoutput = "";
	if (date) {

		let label = (uniquesource === "yes") 
		? "Source date" 
		: "First source date";

		dateoutput = `<div class="work-item"><b>${label}:</b> ${date}</div>`;
	}

	let mensurationOutput = "";
	firstSources.forEach((sourceInfo, index) => {
		let emensurations = sourceInfo["Mensuration Signs in Earliest Source"];
		if (emensurations) {
			// Ensure emensurations is an array; if it's a string, split on semicolons:
			let signs = Array.isArray(emensurations) ? emensurations : emensurations.split(";").map(sign => sign.trim());

			let label = (uniquesource === "yes")
			? "Mensuration sign in source"
			: "Mensuration signs in earliest source";
			if (firstSources.length > 1) label = `Mensuration signs in earliest source ${index + 1}`;

			let signImages = signs.map(sign => {
				sign = String(sign).trim();
				// Preserve editorial annotations beside the symbol, outside its lookup key.
				let annotated = sign.match(/^(.*?)\s*((?:\[[^\]]*\]\s*)+)$/);
				let symbol = annotated ? annotated[1].trim() : sign;
				let annotation = annotated ? annotated[2].trim() : "";
				let filename = mensurationSigns[symbol];
				let escapedSign = escapeCommentaryText(sign);
				if (filename) {
					let image = `<img class="mensuration-sign" src="/images/mensurations/${filename}" alt="${escapeCommentaryText(symbol)}" title="${escapedSign}">`;
					return image + (annotation ? `<span class="mensuration-annotation">${escapeCommentaryText(annotation)}</span>` : "");
				} else {
					console.warn(`Warning: Mensuration sign not found in map: "${sign}"`);
					return `<span class="missing-sign" title="${escapedSign}">${escapedSign}</span>`;
				}
			}).join("");


			mensurationOutput += `<div class="work-item mensuration-item"><b>${label}:</b><span class="mensuration-signs">${signImages}</span></div>`;
		}

	});

	let editionsource       = workinfo["Edition Source"];
	let editionsourceURL    = workinfo["Edition Source URL"];
	let editionsourceoutput = "";

	// Extract modern edition IDs from workinfo
	let modernEditions = workinfo["Modern Editions"];
	let modernEditionsOutput ;

	if (modernEditions) {
	    // Convert semicolon-separated string into an array of trimmed IDs
	    let modernEditionIds = modernEditions.split(";").map(id => id.trim());

	    console.log("Modern Edition IDs:", modernEditionIds); // Debugging: Check extracted IDs

	    // Omit modern editions if the modern edition is listed on the score
	    let externalName       = workinfo["External Project Name"];

	    // Ensure lookup table is defined
	    if (DATA1520.lookup && DATA1520.lookup.modern_editions && !externalName) {
	        // Retrieve matching entries from the lookup table
	        let editionsInfo = modernEditionIds.map(id => {
	            let edition = DATA1520.lookup.modern_editions[id];
	            if (!edition) {
	                console.warn(`Warning: ID not found in lookup - ${id}`);
	            }
	            return edition;
	        }).filter(Boolean); // Remove undefined entries

//////////////////////////////
//
// forceDownload -- Force download of data files (instead of opening in a new browser window).
//

function forceDownload(event) {
	event.stopPropagation();   // Do not open the hyperlink.
	event.preventDefault();    // Prevent default behavior for <a>
	let target = event.target;
	let url = target.getAttribute("href");
	let fallbackUrl = target.dataset.fallbackUrl;
	let filename = url.replace(/.*\//, "");
	downloadFile(url, filename, fallbackUrl);
}



//////////////////////////////
//
// downloadFile -- Save file contents to local computer.
//

function downloadFile(url, filename, fallbackUrl) {
	fetch(url)
	.then(response => {
		if (!response.ok) {
			throw new Error(`Could not download ${url}: ${response.status}`);
		}
		return response.blob();
	})
	.then(blob => {
		const a = document.createElement('a');
		const objectURL = URL.createObjectURL(blob);
		a.href = objectURL;
		a.download = filename;
		a.click();
		URL.revokeObjectURL(objectURL);
	})
	.catch(error => {
		console.error('Error:', error);
		if (fallbackUrl) {
			let fallbackFilename = fallbackUrl.replace(/.*\//, "");
			downloadFile(fallbackUrl, fallbackFilename);
		}
	});
}

//////////////////////////////
//
// downloadAndDisplayInlinePng --
//

async function downloadAndDisplayInlinePng(url, container) {
	try {
		let titleurl    = url //.replace(/-notitle/, "");
		const response  = await fetch(url);
		const blob      = await response.blob();
		const reader    = new FileReader();
		reader.onloadend = function () {
			container.innerHTML = `<a target="_blank" href="${titleurl}"><img style="cursor:pointer"></a>`;
			let imgDiv = container.querySelector("img");
			imgDiv.src = reader.result;
		};
		reader.readAsDataURL(blob);
	} catch (error) {
		console.error("Error fetching or displaying the image:", error);
	}
}



//////////////////////////////
//
// downloadAndDisplayInlineSvg --
//

async function downloadAndDisplayInlineSvg(url, container) {
	try {
		const response = await fetch(url);
		const text     = await response.text();
		const parser   = new DOMParser();
		const doc      = parser.parseFromString(text, "image/svg+xml");
		const svg      = doc.querySelector("svg");

		if (!svg) {
			container.innerHTML = `<a style="cursor:pointer" target="_blank" href="${url}">${text}</a>`;
			return;
		}

		repairMalformedAnalysisViewBox(svg);
		svg.removeAttribute("width");
		svg.removeAttribute("height");
		svg.classList.add("analysis-svg");
		svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

		let link = document.createElement("a");
		link.className = "analysis-svg-link";
		link.style.cursor = "pointer";
		link.target = "_blank";
		link.href = url;
		link.appendChild(document.importNode(svg, true));
		container.replaceChildren(link);
	} catch (error) {
		console.error("Error fetching or displaying the image:", error);
	}
}


//////////////////////////////
//
// repairMalformedAnalysisViewBox -- Some generated range SVGs are missing
//    the min-y viewBox value, e.g. "29   550 102" instead of "29 0 550 102".
//

function repairMalformedAnalysisViewBox(svg) {
	let viewBox = svg.getAttribute("viewBox");
	if (!viewBox) {
		return;
	}

	let values = viewBox.trim().split(/\s+/);
	if (values.length !== 3) {
		return;
	}

	let minX = values[0];
	let width = values[1] || svg.getAttribute("width");
	let height = values[2] || svg.getAttribute("height");
	if (!minX || !width || !height) {
		return;
	}

	svg.setAttribute("viewBox", `${minX} 0 ${width} ${height}`);
}

function downloadData(container, id, ext, ID) {
	let url = `${DATA1520.dataurl}/${DATA1520.workid}-${id}.${ext}`;

		downloadAndDisplayInlinePng(url, container);
	} else if (ext === "svg") {
		downloadAndDisplayInlineSvg(url, container);

}

function updateAudioButton() {
	let button = document.querySelector("#audiobutton-toggle");
	if (!button) return;
	let audio = DATA1520.audio;
	let playing = Boolean(audio && !audio.paused && !audio.ended && !audio.error);
	button.dataset.playing = String(playing);
	button.setAttribute("aria-label", playing ? "Pause" : "Play");
	button.title = playing ? "Pause" : "Play";
}

function playAudioCallback() {
	updateAudioButton();
	DATA1520.audio.setAttribute('controls', 'controls');
	// Both play and playing events can fire for the same playback session.
	if (REFRESH) clearInterval(REFRESH);
	initializeTimemap();
}

//
// pauseAudioCallback --
//

function pauseAudioCallback() {
	updateAudioButton();
	unhighlightAllNotesInSvg();
	if (REFRESH) {
		clearInterval(REFRESH);
	}
}



//////////////////////////////
//
// TogglePlayPauseOfAudio --
//

async function togglePlayPauseOfAudio() {
    let audio = DATA1520.audio;
    if (!audio) return;
    if (audio.paused) {
        try {
            await audio.play();
        } catch (error) {
            updateAudioButton();
            console.error("Unable to start audio playback:", error);
        }
    } else {
        audio.pause();
    }
}
