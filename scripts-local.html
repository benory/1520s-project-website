{% include_relative scripts-listeners.html %}

<script>

//////////////////////////////
//
// fillMostRecentList --
//

function fillMostRecentList(metadata) {
	displayMostRecent(metadata);
	fillInCensusData(metadata);
}

//////////////////////////////
//
// UserSearch --
//

function UserSearch() {
	let query = encodeURIComponent(input.value);
	window.location.href = `/repertoire/?q=${query}`;
}

//////////////////////////////
//
// fillInCensusData --
//

function fillInCensusData(data) {
	let workCount = 0;
	let noteCount = 0;
	let massCount = 0;
	let motetCount = 0;
	let secularCount = 0;

	for (let i=0; i<data.length; i++) {
		let count = data[i]["Note Count"];
		if (count) {
			noteCount += parseInt(count);
		}
	}

	for (let i=0; i<data.length; i++) {
		let genre = data[i]["Genre"];
		workCount++;

		if (genre == "mass"){
			massCount++;
		}
		if (genre == "motet"){
			motetCount++;
		}
		if (genre == "secular work"){
			secularCount++;
		}
	}

  let roundworkCount = Math.floor(workCount / 25) * 25;

	let noteElement = document.querySelector("#note-count");
	if (noteElement) {
		noteElement.textContent = String(noteCount);
	}

	let workElement = document.querySelector("#work-count");
	if (workElement) {
		workElement.innerHTML = workCount;
	}

	let roundworkElement = document.querySelector("#roundwork-count");
	if (roundworkElement) {
		if (roundworkCount !== workCount){
			roundworkElement.innerHTML = `more than ${roundworkCount}`;
		}
		else if (roundworkCount == workCount){
			roundworkElement.innerHTML = `${roundworkCount}`;
		}
	}

	let massElement = document.querySelector("#mass-count");
	if (massElement) {
		massElement.innerHTML = massCount;
	}

	let motetElement = document.querySelector("#motet-count");
	if (motetElement) {
		motetElement.innerHTML = motetCount;
	}

	let secularElement = document.querySelector("#secular-count");
	if (secularElement) {
		secularElement.innerHTML = secularCount;
	}

}



//////////////////////////////
//
// formatBigNumber -- avoid using commas to make Europeans happier
//

function formatBigNumber(number) {
	return number.toString().replace(/(\d)(?=(\d{3})+$)/g, '$1 ');
}



//////////////////////////////
//
// displayMostRecent --  Display the most recently added works.   The
//    number of works displayed is controled by a data parameter in the
//    HTML code where the table will be displayed:
//        <div data-count="10" id="most-recent"></div>
//    in this case the 10 most recent works will be displayed in the list.
//

function displayMostRecent(metadata) {
	metadata.sort(compareByDateAdded);

	let element = document.querySelector("#general");
	if (!element) {
		console.error("Cannot find #general.");
		return;
	}
	let count = element.dataset.count;
	if (count < 1) {
		count = 10;
	}
	if (count > 50) {
		count = 50;
	}

	const recent = metadata.slice(0, Math.min(Number(count), metadata.length));
	const midpoint = Math.ceil(recent.length / 2);
	element.innerHTML = `<div class="recent-works-grid">${[recent.slice(0, midpoint), recent.slice(midpoint)].map(column =>
		`<ul class="recent-works-column">${column.map(entry => `<li class="recent-work">
			<div class="recent-work-title-row">${prepareTitle(entry)}<span class="recent-work-date">${prepareDate(entry["Date Added"])}</span></div>
			<p class="recent-work-composer">${prepareComposer(entry)}</p>
		</li>`).join("")}</ul>`
	).join("")}</div>`;
}



//////////////////////////////
//
// prepareTitle -- Merge title and subtitle fields and apply URL.
//

function prepareTitle(entry) {
	let output = `<em>${escapeHomeText(entry.Title)}</em>`;
	if (entry.Subtitle) {
		output += `, <span class="work-subtitle">${escapeHomeText(entry.Subtitle)}</span>`;
	}
	let id = entry.ID || "";
	if (id) {
		output = `<a href="/work/?id=${encodeURIComponent(id)}">${output}</a>`;
	}
	return output;
}



//////////////////////////////
//
// prepareDate -- convert YYYY-M-D to D MMM YYYY
//

function prepareDate(inputDateString) {
	if (!inputDateString) {
		return "";
	}
	let parsedDate = new Date(inputDateString.replace(/-/g, "/"));
	let monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
	let day = parsedDate.getDate();
	let month = monthNames[parsedDate.getMonth()];
	let year = parsedDate.getFullYear();
	let fullDate = `${day} ${month} ${year}`;
	let mobileDate = `${day} ${month.slice(0, 3)} ${year}`;
	return `<span class="recent-date-full">${fullDate}</span><span class="recent-date-mobile">${mobileDate}</span>`;
}



//////////////////////////////
//
// prepareComposer -- Show the full composer name on desktop and the
//     spreadsheet's short name on mobile.
//

function prepareComposer(entry) {
  if (!entry) return "";

  const name = entry.Composer || "";
  const shortName = getShortComposerName(entry) || name;

  let fullName = "";

  // Case 1: "Last, First" → First Last (normal weight first, bold last via CSS)
  let matches = name.match(/^\s*([^,]+)\s*,\s*([^,]+)\s*$/);
  if (matches) {
    fullName = `<span class="first-name">${matches[2]}</span> <span class="last-name">${matches[1]}</span>`;
  } else {
    // Case 2: single-name composer → bold
    fullName = `<span class="last-name">${name}</span>`;
  }

  return `<span class="composer-name-full">${fullName}</span><span class="composer-name-short">${shortName}</span>`;
}

function getShortComposerName(entry) {
  const idMatch = (entry.ID || "").match(/^([A-Z][a-z]{2})/);
  let composerInfo = idMatch
    ? COMPOSERS.find(composer => composer.ID === idMatch[1])
    : null;

  if (!composerInfo && entry.Composer) {
    composerInfo = COMPOSERS.find(composer => composer.Composer === entry.Composer);
  }

  return composerInfo ? composerInfo["Short Name"] : "";
}



//////////////////////////////
//
// compareByDateAdded -- For sorting metadata entries by "Date Added".
//

function compareByDateAdded(a, b) {
  // Handle null or empty dates by placing them at the end
  if (!a["Date Added"] && !b["Date Added"]) return 0;
  if (!a["Date Added"]) return 1;
  if (!b["Date Added"]) return -1;

  // Convert date strings to Date objects for comparison
  const dateA = new Date(a["Date Added"].replace(/-/g, "/"));
  const dateB = new Date(b["Date Added"].replace(/-/g, "/"));

  // Compare the dates
  if (dateA < dateB) return 1;
  if (dateA > dateB) return -1;
  return 0;
}

//////////////////////////////
//
// displayTopComposers --
//

function escapeHomeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

function displayTopComposers() {
  const element = document.getElementById("composer-plot");
  if (!element) return;
  const totals = new Map();
  METADATA.forEach(entry => {
    if (entry.Composer) totals.set(entry.Composer, (totals.get(entry.Composer) || 0) + 1);
  });
  const composers = [...totals].filter(([, count]) => count >= 25).sort((a, b) => b[1] - a[1]);
  const maximum = Math.max(30, Math.ceil(Math.max(0, ...composers.map(([, count]) => count)) / 30) * 30);
  element.innerHTML = `<div class="composer-chart" aria-label="Works by composer">${composers.map(([name, count]) => {
    const intensity = Math.min(1, (count - 21) / Math.max(1, maximum - 22));
    const channel = (light, dark) => Math.round(light + (dark - light) * intensity);
    const color = `rgb(${channel(245, 192)},${channel(238, 115)},${channel(220, 81)})`;
    return `<div class="composer-row"><a href="/repertoire/?c=${encodeURIComponent(name)}">${escapeHomeText(name)}</a><span class="composer-track" aria-hidden="true"><span class="composer-bar" style="width:${count / maximum * 100}%;background:${color}"></span></span><span class="composer-count">${count}</span></div>`;
  }).join("")}</div><div class="composer-axis" aria-hidden="true">${[0, maximum / 3, maximum * 2 / 3, maximum].map(tick => `<span>${tick}</span>`).join("")}</div><p class="composer-axis-title">Number of Works</p>`;
}

function renderSuggestion(entry) {
  const title = `<em>${escapeHomeText(entry.Title)}</em>${entry.Subtitle
    ? `, <span class="work-subtitle">${escapeHomeText(entry.Subtitle)}</span>`
    : ""}`;

  const composer = entry.Composer || "Unknown";
  const genre = entry.Genre || "";
  const source = entry["First Source"] || "";

  return `
    <div class="search-suggestion"
         onclick="goToWork('${entry.ID}')">
      <div class="primary">${title}</div>
      <div class="secondary">
        ${composer}
        ${genre ? " · " + genre : ""}
      </div>
    </div>
  `;
}

function goToWork(id) {
  window.location.href = `/work?id=${id}`;
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".apple-search")) {
    document.querySelector("#search-suggestions").classList.add("hidden");
  }
});

//////////////////////////////
//
// renderSeeMoreRow -- link to repertoire page
//

function renderSeeMoreRow(query) {
  const encoded = encodeURIComponent(query);
  return `
    <div class="search-see-more">
      <a class="search-more-button" href="/repertoire/?q=${encoded}">See more results <span aria-hidden="true">↗</span></a>
    </div>
  `;
}

//////////////////////////////
//
// goToRepertoire -- navigate to repertoire page
//

function goToRepertoire(query) {
  window.location.href = `/repertoire?q=${query}`;
}

window.addEventListener("resize", () => {
	displayTopComposers();
});

//////////////////////////////
//
// renderComposerSuggestion -- composer suggestions for browse
//

function renderComposerSuggestion(composer) {
  // Special case: Anonymous
  if (composer.ID === "Any" || composer.Composer === "Anonymous") {
    return `
      <div class="search-suggestion composer-suggestion"
           data-id="Any">
        <div class="suggestion-main"><span class="suggestion-name">See all anonymous works</span></div>
      </div>
    `;
  }

  // Normal composer case
  const name = escapeHomeText(formatComposerName(composer.Composer));
  const flourish = formatFlourish(composer);
  const places = formatPlaces(composer);

  const metaParts = [flourish, places].filter(Boolean).join("; ");

  return `
    <div class="search-suggestion composer-suggestion"
         data-id="${composer.ID}">
      <div class="suggestion-main">See all works by <span class="suggestion-name">${name}</span></div>
      ${metaParts ? `<div class="suggestion-meta">${metaParts}</div>` : ""}
    </div>
  `;
}

function formatComposerName(name) {
  if (!name) return "";

  // If "Last, First" → "First Last"
  if (name.includes(",")) {
    const [last, first] = name.split(",").map(s => s.trim());
    return `${first} ${last}`;
  }

  // Otherwise leave unchanged
  return name;
}

function formatComposerName(name) {
  if (!name) return "";
  if (name.includes(",")) {
    const [last, first] = name.split(",").map(s => s.trim());
    return `${first} ${last}`;
  }
  return name;
}

function formatFlourish(composer) {
  return composer.Flourished ? `<i>fl.</i> ${composer.Flourished}` : "";
}

function formatPlaces(composer) {
  return composer["Places Active"]
    ? `active in ${composer["Places Active"]}`
    : "";
}

function buildGenreIndex(metadata) {
  const map = {};

  metadata.forEach(entry => {
    if (!entry.Genre) return;

    const raw = entry.Genre.trim().toLowerCase();

    if (!map[raw]) {
      map[raw] = {
        raw,
        count: 0
      };
    }
    map[raw].count++;
  });

  return map;
}

function normalizeSearchString(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function getGenreMatches(query) {
  return Object.values(GENRE_INDEX)
    .filter(g => g.raw.includes(query))
    .map(g => ({
      key: g.raw,
      label: GENRE_LABELS[g.raw] || g.raw,
      count: g.count
    }));
}

function renderGenreSuggestion(genre) {
  return `
    <div class="search-suggestion genre-suggestion"
         data-genre="${genre.key}">
      <div class="suggestion-main">
        See all ${genre.label}
      </div>
      <div class="suggestion-meta">
        ${genre.count} works
      </div>
    </div>
  `;
}

</script>
