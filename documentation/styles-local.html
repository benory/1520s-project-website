<style>
html {

}

.page-documentation article.post { width: 100%; }

  padding-top: 22px;
  gap: 30px;
}
.page-documentation .main-content { flex: 1; min-width: 0; }
.project-site.page-documentation .main-content p,
.project-site.page-documentation .main-content ul,
.project-site.page-documentation .main-content ol {
  font-size: 15px;
  line-height: 1.6;
}
.project-site.page-documentation .main-content .spaced-list,
.project-site.page-documentation .main-content .narrow-list { font-size: 14px; }

.page-documentation .main-content section { margin-bottom: 20px; }

.project-site.page-documentation .main-content h2 {

}

}

.page-documentation .documentation-figure object,
.page-documentation .documentation-figure img { display: block; margin: 0; width: 100%; height: auto; }

.page-documentation .main-content svg { width: 100% !important; height: auto !important; }

  padding-left: 0;
}
.page-documentation .workflow-list > li {

  position: relative;
  padding-left: 38px;
  margin-bottom: 28px;
}
.page-documentation .workflow-list > li::before {

  position: absolute;
  left: 0;
  top: 2px;

  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
}

}
.page-documentation .documentation-command {

  padding: 12px 14px;

  border-radius: 5px;

  overflow-x: auto;
}

  padding: 0;

  overflow-wrap: normal;

  width: auto;
  max-width: 100%;

  color: var(--project-ink);
  font: 400 14px/1.45 var(--project-sans);
}
.page-documentation .documentation-fields th,
.page-documentation .documentation-fields td {
  text-align: left;
  vertical-align: top;
  padding: 8px 12px;
  border: 0;
  border-bottom: 1px solid var(--project-line);
}
.page-documentation .documentation-fields thead th {
  background: var(--project-blue-wash);
  font-size: 14px;
  font-weight: 500;
}
.page-documentation .documentation-fields tbody th { width: 65px; font-weight: 400; }
.project-site.page-documentation .documentation-fields code { padding: 0; background: transparent; }

  padding: 10px 12px;
  border: 1px solid var(--project-line);

    position: static;
    flex: none;
    width: 100%;
    max-height: none;
    padding: 0 0 14px;
    border-right: 0;
    border-bottom: 1px solid var(--project-line);
  }
  .page-documentation .toc-ready .toc-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: 0;
    padding: 6px 0;
    color: var(--project-link);
    background: transparent;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
  }
  .page-documentation .toc-toggle-symbol { font-size: 22px; line-height: 1; }
  .page-documentation .toc-ready .toc-content { display: none; }
  .page-documentation .toc-ready.is-open .toc-content { display: block; padding-top: 12px; }
  .page-documentation .toc-ready .toc-content h4 { display: none; }
  .page-documentation .toc-container a { padding-top: 3px; padding-bottom: 3px; }

  .page-documentation .documentation-fields td { padding: 8px; }

}

  .page-documentation .toc-container a:not(.toc-last-link) { padding-bottom: var(--toc-fill-gap, 0px); }
}
</style>
