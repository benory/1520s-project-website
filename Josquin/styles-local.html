<style>

.wrapper {
  max-width: 1000px;
  padding-left: 24px;
  padding-right: 24px;
}

.page-content {
  padding: 0px;
  flex: 1;
}

.main-content section {
  margin-bottom: 28px;
}

.main-content p {
  margin-bottom: 16px;
}

#search-interface {
  margin: 0 0 20px;
}

.dataset-download {
  margin: 0 0 38px;
}

.page-josquin .josquin-introduction { max-width: 900px; margin-left: 20px; }
.page-josquin .dataset-download { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 28px; }
.project-site.page-josquin .dataset-download-button {
  display: inline-block;
  padding: 7px 11px;
  border-radius: 5px;
  background: var(--project-blue-wash);
  font-size: 14px;
  line-height: 1.4;
}
.project-site.page-josquin .dataset-download-button:hover { background: #dcebf7; }
.page-josquin .dataset-download > span { color: var(--project-muted); font-size: 13px; }

.page-josquin .attribution-key { position: relative; margin-top: 0; max-width: 760px; }
.page-josquin .attribution-key summary {
  position: absolute;
  left: 0;
  bottom: 100%;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  list-style: none;
  color: var(--project-link);
  font-size: 14px;
  cursor: pointer;
}
.page-josquin .attribution-key summary::-webkit-details-marker { display: none; }
.page-josquin .attribution-key summary::after { content: "+"; font-size: 18px; line-height: 1; }
.page-josquin .attribution-key[open] summary::after { content: "−"; }
.page-josquin .attribution-key summary:hover { text-decoration: underline; text-underline-offset: 3px; }
.page-josquin .attribution-key-content { padding: 12px 0 2px 18px; }
.page-josquin .attribution-key dl { margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
.page-josquin .attribution-key dl > div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; margin-bottom: 8px; }
.page-josquin .attribution-key dt { font-weight: 500; }
.page-josquin .attribution-key dt span { color: var(--project-muted); font-weight: 400; }
.page-josquin .attribution-key dd { margin: 0; }
.page-josquin .attribution-key dd strong { font-weight: 500; }
.project-site.page-josquin .attribution-key-content p { margin-bottom: 0; font-size: 13px; line-height: 1.5; color: var(--project-muted); }

.page-josquin #list { overflow-x: auto; }
.project-site.page-josquin #list table.general {
  display: table;
  width: 100%;
  min-width: 980px;
  table-layout: fixed;
  overflow: visible;
}
.page-josquin #list table.general td { white-space: normal; overflow-wrap: anywhere; }
.page-josquin #list table.general .date-range { display: inline-block; white-space: nowrap; }
.page-josquin #list table.general th,
.page-josquin .josquin-sticky-header th { white-space: normal; }
.page-josquin #list table.general td:nth-child(4) { font-style: italic; }
.page-josquin table.general .heading-note { display: block; margin-top: 3px; font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.page-josquin .josquin-sticky-header {
  position: fixed;
  z-index: 40;
  overflow: hidden;
  pointer-events: none;
  box-shadow: 0 2px 5px rgb(35 54 65 / 8%);
}
.project-site.page-josquin .josquin-sticky-header table.general {
  display: table;
  table-layout: fixed;
  max-width: none;
  margin: 0;
  border-radius: 0;
  overflow: visible;
  box-shadow: none;
}
.page-josquin .josquin-sticky-header th { box-sizing: border-box; }

#search-interface.catalogue-toolbar {
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

#search-interface .row {
  display: grid;
  grid-template-columns: minmax(270px, 36%) minmax(0, 1fr);
  column-gap: 24px;
  align-items: start;
  margin: 0;
}

.left-group,
.right-group {
  min-width: 0;
}

.left-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  padding-right: 22px;
}

.right-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-height: 92px;
  padding-left: 24px;
  border-left: 1px solid rgba(40, 75, 99, 0.24);
}

#input {
  width: 100%;
  height: 42px;
  box-sizing: border-box;

  color: #1c1c1e;
  font-size: 16px;
  line-height: 1.4;

  padding: 8px 12px 8px 40px;

  border-radius: 4px;
  border: 1px solid rgba(40, 75, 99, 0.32);
  background-color: rgba(255, 253, 248, 0.74);
  background-image: url('/images/searchicon.png');
  background-position: 13px center;
  background-repeat: no-repeat;
  background-size: 16px;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease,
    background-color 0.15s ease;
}

#input::placeholder {
  color: #77716a;
}

#input:hover,
select:hover {
  border-color: rgba(40, 75, 99, 0.5);
  background-color: rgba(255, 253, 248, 0.94);
}

#input:focus,
select:focus {
  outline: none;
  border-color: rgba(40, 75, 99, 0.66);
  box-shadow: 0 0 0 2px rgba(40, 75, 99, 0.12);
}

th { text-align: left; }

table.general thead th {
  background: linear-gradient(
    to bottom,
    rgba(0,122,255,0.14),
    rgba(0,122,255,0.08)
  );
  color: #003a8f;               /* deep Apple blue */
  border-bottom: 1px solid rgba(0,122,255,0.25);
}

#dropdowns {
  display: grid;
  grid-template-columns: 190px 240px;
  column-gap: 16px;
  row-gap: 12px;
  justify-content: end;
  align-items: end;
}

.top-line,
.bottom-line {
  display: contents;
}

#source-type-container,
#source-genre-container,
#attribution-category-container,
#josquin-attribution-container {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  min-width: 0;
}

#source-type-container::before,
#source-genre-container::before,
#attribution-category-container::before,
#josquin-attribution-container::before {
  color: #1c1c1e;
  font-size: 14px;
  line-height: 1.2;
}

#source-type-container::before {
  content: "Source type";
}

#attribution-category-container::before {
  content: "Attribution category";
}

#source-genre-container::before {
  content: "Genre";
}

#josquin-attribution-container::before {
  content: "Attributed to Josquin?";
}

select {
  width: 100%;
  height: 34px;
  box-sizing: border-box;

  color: #1c1c1e;
  font: 400 14px/1.2 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  padding: 6px 28px 6px 9px;
  border-radius: 4px;
  border: 1px solid rgba(40, 75, 99, 0.32);
  background-color: rgba(255, 253, 248, 0.74);

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  background-image: url('data:image/svg+xml;utf8,\
<svg fill="%23284b63" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">\
<path d="M7 10l5 5 5-5z"/>\
</svg>');
  background-repeat: no-repeat;
  background-position: right 9px center;
  background-size: 16px;

  cursor: pointer;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease,
    background-color 0.15s ease;
}

.search-meta {
  min-height: 20px;
}

#search-count {
  color: #5f5951;
  font-size: 14px;
}


#search-count:empty {
  display: none;
}

@media (max-width: 820px) {
  .page-josquin .attribution-key { margin-top: 16px; }
  .page-josquin .attribution-key summary { position: static; }
  #search-interface .row {
    grid-template-columns: 1fr;
    row-gap: 18px;
  }

  .left-group {
    padding-right: 0;
  }

  .right-group {
    padding-left: 0;
    border-left: 0;
  }

  #dropdowns {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    justify-content: stretch;
  }
}

@media (max-width: 940px) and (min-width: 821px) {
  #search-interface .row {
    grid-template-columns: minmax(220px, 30%) minmax(0, 1fr);
    column-gap: 18px;
  }

  .left-group {
    padding-right: 16px;
  }

  .right-group {
    padding-left: 18px;
  }

  #dropdowns {
    grid-template-columns: 170px 220px;
    column-gap: 12px;
  }
}

@media (max-width: 560px) {
  #dropdowns {
    grid-template-columns: 1fr;
  }
}

</style>
